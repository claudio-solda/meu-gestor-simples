<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Gestor Simples</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d6fd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestor">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#dfe3ea;--pri:#1d6fd8;--ok:#1f9d55;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e232b;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#2f3640;--pri:#5aa2f5;--ok:#44c27b;--bad:#f07272}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Arial,sans-serif;font-size:15px}
.w{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:20px;text-align:center;margin:6px 0 2px}
.sub{text-align:center;color:var(--mut);font-size:13px;margin:0 0 12px}
.cover{background:linear-gradient(135deg,#0f3d8a,#1d6fd8 60%,#4aa3ff);color:#fff;border-radius:16px;padding:22px 16px 16px;text-align:center;margin-bottom:14px;box-shadow:0 4px 14px rgba(15,61,138,.3)}
.logo{width:64px;height:64px;margin:0 auto 10px;border-radius:18px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:34px;border:1px solid rgba(255,255,255,.35)}
.cover h1{color:#fff;font-size:24px;margin:0}
.cover p{margin:4px 0 14px;font-size:13px;opacity:.9}
.cs{display:flex;gap:8px}
.cs div{flex:1;background:rgba(255,255,255,.16);border-radius:10px;padding:8px 4px;font-size:11px}
.cs b{display:block;font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:13px}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:9px 14px;border:0;border-radius:7px;background:var(--pri);color:#fff;font:inherit;margin-top:10px}
.btn.s{background:var(--bd);color:var(--tx);margin:0;padding:5px 9px;font-size:13px}
.btn.d{background:var(--bad)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mut);font-size:12px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--bd)}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.col{min-width:220px;flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
.col h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
.t{background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:9px;margin-bottom:8px;font-size:13px}
.t b{font-size:14px}.t p{margin:4px 0;color:var(--mut)}
.mv{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.late{color:var(--bad);font-weight:600}
.tot{display:flex;gap:8px;flex-wrap:wrap}
.tot div{flex:1;min-width:90px;background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.tot b{display:block;font-size:16px}
.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="w">
<div class="cover"><div class="logo">📋</div><h1>Meu Gestor Simples</h1><p>Projetos, tarefas e custos em um só lugar</p><div class="cs" id="cs"></div></div>
<div class="tabs" id="tabs"></div>
<div id="v"></div>
</div>
<script>
var COLS=["A fazer","Em andamento","Em revisão","Bloqueado","Concluído"];
var COLORS={"A fazer":"#8a94a6","Em andamento":"#1d6fd8","Em revisão":"#e0a100","Bloqueado":"#d64545","Concluído":"#1f9d55"};
var PST=["Ativo","Pausado","Concluído"];
var CATS=["Software","Mão de obra","Marketing","Equipamento","Outros"];
var KEY="gestor-simples-v1";
var D={projetos:[],tarefas:[],custos:[],seq:1};
var tab="geral",pid=null,editT=null;
function load(){try{var s=localStorage.getItem(KEY);if(s){D=JSON.parse(s)}}catch(e){}
if(!D.projetos.length&&!D.tarefas.length){D.projetos=[{id:1,nome:"Implantação de CRM",status:"Ativo",resp:"Claudio",orc:5000}];D.tarefas=[{id:2,pid:1,nome:"Configurar pipeline",desc:"Deixar o funil de vendas pronto para a equipe.",resp:"Claudio",ini:"2026-10-01",fim:"2026-10-15",st:"Em andamento"}];D.custos=[{id:3,pid:1,tipo:"Fixo",cat:"Software",valor:300,data:"2026-10-05",desc:""}];D.seq=4}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(n){return "R$ "+Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function dt(s){if(!s)return "-";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function pj(id){return D.projetos.filter(function(p){return p.id==id})[0]}
function tot(id,tipo){return D.custos.filter(function(c){return c.pid==id&&(!tipo||c.tipo==tipo)}).reduce(function(a,c){return a+c.valor},0)}
function go(t){tab=t;render()}
function render(){
if(!pid&&D.projetos.length)pid=D.projetos[0].id;
var ab=D.tarefas.filter(function(t){return t.st!="Concluído"}).length,ct=D.custos.reduce(function(a,c){return a+c.valor},0);
$("cs").innerHTML='<div><b>'+D.projetos.length+'</b>Projetos</div><div><b>'+ab+'</b>Tarefas abertas</div><div><b>'+money(ct)+'</b>Custo total</div>';
var T=[["geral","Projetos"],["kanban","Kanban"],["custos","Custos"]];
$("tabs").innerHTML=T.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
$("v").innerHTML=tab=="geral"?vGeral():tab=="kanban"?vKanban():vCustos();
}
function popts(sel){return D.projetos.map(function(p){return '<option value="'+p.id+'"'+(p.id==sel?" selected":"")+'>'+esc(p.nome)+'</option>'}).join("")}
function pickP(fn){return '<label>Projeto</label><select onchange="pid=+this.value;render()">'+popts(pid)+'</select>'}
function vGeral(){
var r=D.projetos.map(function(p){var n=D.tarefas.filter(function(t){return t.pid==p.id}).length,c=D.tarefas.filter(function(t){return t.pid==p.id&&t.st=="Concluído"}).length;
return '<tr><td>'+esc(p.nome)+'</td><td><span class="tag">'+p.status+'</span></td><td>'+esc(p.resp)+'</td><td>'+c+'/'+n+'</td><td>'+money(tot(p.id))+(p.orc?' de '+money(p.orc):'')+'</td><td><button class="btn s" onclick="pid='+p.id+';go(\'kanban\')">Abrir</button> <button class="btn s" onclick="delP('+p.id+')">Excluir</button></td></tr>'}).join("");
return '<div class="card"><h3>📁 Visão Geral de Projetos</h3><div class="sc"><table><tr><th>Projeto</th><th>Status</th><th>Responsável</th><th>Tarefas</th><th>Custo</th><th></th></tr>'+(r||'<tr><td colspan="6" class="mut">Nenhum projeto ainda.</td></tr>')+'</table></div></div>'+
'<div class="card"><h3>➕ Novo projeto</h3><label>Nome</label><input id="pn"><div class="row"><div><label>Responsável</label><input id="pr"></div><div><label>Status</label><select id="ps">'+PST.map(function(s){return '<option>'+s+'</option>'}).join("")+'</select></div></div><label>Orçamento (R$, opcional)</label><input id="po" type="number" step="0.01" inputmode="decimal"><button class="btn" onclick="addP()">Salvar projeto</button></div><div class="card"><h3>🧪 Exemplos</h3><p class="mut">Carrega 2 projetos baseados nos seus apps, com tarefas em todas as colunas e custos, para você ver o app funcionando. Não apaga nada do que você já cadastrou.</p><button class="btn" onclick="loadEx()">Carregar exemplos dos meus apps</button></div>'}
function addP(){var n=$("pn").value.trim();if(!n){alert("Informe o nome do projeto.");return}
D.projetos.push({id:D.seq++,nome:n,resp:$("pr").value.trim(),status:$("ps").value,orc:parseFloat($("po").value)||0});pid=D.projetos[D.projetos.length-1].id;save();render()}
function loadEx(){var a=D.seq++,b=D.seq++;
D.projetos.push({id:a,nome:"Exemplo: App NIKEN Qualidade",status:"Ativo",resp:"Claudio",orc:2000},{id:b,nome:"Exemplo: Quadro de Operadores",status:"Ativo",resp:"Claudio",orc:800});
function T(p,n,d,s,i,f){D.tarefas.push({id:D.seq++,pid:p,nome:n,desc:d,resp:"Claudio",ini:i,fim:f,st:s})}
function C(p,t,c,v,dd,ds){D.custos.push({id:D.seq++,pid:p,tipo:t,cat:c,valor:v,data:dd,desc:ds})}
T(a,"Cadastrar Plano de Controle","Telas do RIP, ITP e Plano de Controle","Concluído","2026-10-01","2026-10-10");
T(a,"Testar no coletor","Validar com operadores no chão de fábrica","Em andamento","2026-10-20","2026-10-30");
T(a,"Revisar textos com a qualidade","Conferir nomes de documentos","Em revisão","2026-10-22","2026-10-28");
T(a,"Liberar internet no coletor","Depende da TI","Bloqueado","2026-10-15","2026-10-20");
T(a,"Treinar operadores","Mostrar como usar o app","A fazer","2026-11-03","2026-11-10");
T(b,"Listar as 18 máquinas","Cadastro das máquinas do 1º turno","Concluído","2026-09-25","2026-09-28");
T(b,"Alocar operadores","Ver quem fica sem máquina","Em andamento","2026-10-01","2026-10-31");
T(b,"Apresentar ao diretor","Mostrar o quadro pronto","A fazer","2026-11-05","2026-11-06");
C(a,"Fixo","Software",100,"2026-10-05","Assinatura de ferramentas");
C(a,"Variável","Mão de obra",600,"2026-10-12","Horas de desenvolvimento");
C(a,"Variável","Equipamento",250,"2026-10-18","Suporte para coletor");
C(b,"Fixo","Software",50,"2026-09-30","Hospedagem");
C(b,"Variável","Mão de obra",300,"2026-10-08","Horas de desenvolvimento");
pid=a;save();render()}
function delP(id){if(!confirm("Excluir o projeto, suas tarefas e custos?"))return;D.projetos=D.projetos.filter(function(p){return p.id!=id});D.tarefas=D.tarefas.filter(function(t){return t.pid!=id});D.custos=D.custos.filter(function(c){return c.pid!=id});pid=null;save();render()}
function vKanban(){
if(!D.projetos.length)return '<div class="card mut">Cadastre um projeto primeiro.</div>';
var hoje=new Date().toISOString().slice(0,10);
var cols=COLS.map(function(c){var L=D.tarefas.filter(function(t){return t.pid==pid&&t.st==c});
var i=COLS.indexOf(c);
return '<div class="col"><h4 style="color:'+COLORS[c]+'"><span>'+c+'</span><span>'+L.length+'</span></h4>'+L.map(function(t){
return '<div class="t"><b>'+esc(t.nome)+'</b>'+(t.desc?'<p>'+esc(t.desc)+'</p>':'')+'<div class="mut">👤 '+esc(t.resp||"-")+'</div><div class="mut'+(t.fim&&t.fim<hoje&&t.st!="Concluído"?' late':'')+'">📅 '+dt(t.ini)+' até '+dt(t.fim)+'</div><div class="mv">'+
(i>0?'<button class="btn s" onclick="mv('+t.id+',-1)">←</button>':'')+(i<COLS.length-1?'<button class="btn s" onclick="mv('+t.id+',1)">→</button>':'')+'<button class="btn s" onclick="ed('+t.id+')">Editar</button><button class="btn s" onclick="delT('+t.id+')">✕</button></div></div>'}).join("")+'</div>'}).join("");
var e=editT?D.tarefas.filter(function(t){return t.id==editT})[0]:null;e=e||{};
return '<div class="card"><h3>📊 Kanban por projeto</h3>'+pickP()+'<div class="kb" style="margin-top:10px">'+cols+'</div></div>'+
'<div class="card"><h3>'+(e.id?'✏️ Editar tarefa':'➕ Nova tarefa')+'</h3><label>Nome</label><input id="tn" value="'+esc(e.nome)+'"><label>Descrição</label><textarea id="td" rows="2">'+esc(e.desc)+'</textarea><div class="row"><div><label>Responsável</label><input id="tr" value="'+esc(e.resp)+'"></div><div><label>Status</label><select id="ts">'+COLS.map(function(c){return '<option'+(c==(e.st||"A fazer")?" selected":"")+'>'+c+'</option>'}).join("")+'</select></div><div><label>Início</label><input id="ti" type="date" value="'+(e.ini||"")+'"></div><div><label>Fim</label><input id="tf" type="date" value="'+(e.fim||"")+'"></div></div><button class="btn" onclick="saveT()">Salvar tarefa</button>'+(e.id?' <button class="btn s" style="margin-top:10px" onclick="editT=null;render()">Cancelar</button>':'')+'</div>'}
function mv(id,d){var t=D.tarefas.filter(function(x){return x.id==id})[0];t.st=COLS[COLS.indexOf(t.st)+d];save();render()}
function ed(id){editT=id;render();window.scrollTo(0,document.body.scrollHeight)}
function delT(id){if(!confirm("Excluir tarefa?"))return;D.tarefas=D.tarefas.filter(function(t){return t.id!=id});save();render()}
function saveT(){var n=$("tn").value.trim();if(!n){alert("Informe o nome da tarefa.");return}
var o={nome:n,desc:$("td").value.trim(),resp:$("tr").value.trim(),st:$("ts").value,ini:$("ti").value,fim:$("tf").value};
if(editT){var t=D.tarefas.filter(function(x){return x.id==editT})[0];for(var k in o)t[k]=o[k];editT=null}else{o.id=D.seq++;o.pid=pid;D.tarefas.push(o)}
save();render()}
function vCustos(){
if(!D.projetos.length)return '<div class="card mut">Cadastre um projeto primeiro.</div>';
var p=pj(pid),L=D.custos.filter(function(c){return c.pid==pid}).sort(function(a,b){return a.data<b.data?1:-1});
var tt=tot(pid),sobra=p.orc?p.orc-tt:null;
return '<div class="card"><h3>💰 Controle de custo</h3>'+pickP()+'<div class="tot" style="margin-top:10px"><div><span class="mut">Fixo</span><b>'+money(tot(pid,"Fixo"))+'</b></div><div><span class="mut">Variável</span><b>'+money(tot(pid,"Variável"))+'</b></div><div><span class="mut">Total</span><b>'+money(tt)+'</b></div>'+(sobra!==null?'<div><span class="mut">Saldo do orçamento</span><b style="color:'+(sobra<0?'var(--bad)':'var(--ok)')+'">'+money(sobra)+'</b></div>':'')+'</div></div>'+
'<div class="card"><div class="sc"><table><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th></th></tr>'+(L.map(function(c){return '<tr><td>'+dt(c.data)+'</td><td>'+c.tipo+'</td><td>'+esc(c.cat)+'</td><td>'+esc(c.desc)+'</td><td><b>'+money(c.valor)+'</b></td><td><button class="btn s" onclick="delC('+c.id+')">✕</button></td></tr>'}).join("")||'<tr><td colspan="6" class="mut">Sem custos.</td></tr>')+'</table></div></div>'+
'<div class="card"><h3>➕ Novo custo</h3><div class="row"><div><label>Tipo</label><select id="ct"><option>Fixo</option><option>Variável</option></select></div><div><label>Categoria</label><select id="cc">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></div><div><label>Valor (R$)</label><input id="cv" type="number" step="0.01" inputmode="decimal"></div><div><label>Data</label><input id="cd" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div></div><label>Descrição (opcional)</label><input id="cx"><button class="btn" onclick="addC()">Salvar custo</button></div>'}
function addC(){var v=parseFloat($("cv").value);if(!(v>0)){alert("Informe um valor.");return}
D.custos.push({id:D.seq++,pid:pid,tipo:$("ct").value,cat:$("cc").value,valor:v,data:$("cd").value,desc:$("cx").value.trim()});save();render()}
function delC(id){if(!confirm("Excluir custo?"))return;D.custos=D.custos.filter(function(c){return c.id!=id});save();render()}
load();render();
try{if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script>
</body>
</html>
