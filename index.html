<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))}
.w{max-width:1000px;margin:0 auto;padding:12px}

.av{margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

nav button.on{color:var(--pri);font-weight:700}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mo{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.mo{align-items:center}.md{border-radius:20px}}
.mh{display:flex;justify-content:space-between;align-items:center}
.ck{display:flex;align-items:center;gap:8px;padding:5px 0}.ck input{width:20px;height:20px;flex:none}.ck span{flex:1;font-size:14px}.ck .dn{text-decoration:line-through;color:var(--mut)}

.rl{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin:8px 0 3px}
.bk{height:10px;background:#e6e9ef;border-radius:6px;overflow:hidden}.bk i{display:block;height:100%}
</style>

<body>

<script>
var KEY="gestor-simples-v1";
var CATS=["Software","Mão de obra","Marketing","Equipamento","Outros"];
var PST=["Ativo","Pausado","Concluído"];
var TC=["#ef4444","#f59e0b","#2563eb","#8b5cf6","#10b981","#ec4899","#64748b","#0ea5e9"];
var BG=["linear-gradient(135deg,#0f3d8a,#4aa3ff)","linear-gradient(135deg,#5b2a86,#c084fc)","linear-gradient(135deg,#9f1239,#fb7185)","linear-gradient(135deg,#0f766e,#5eead4)","linear-gradient(135deg,#b45309,#fcd34d)","linear-gradient(135deg,#1e293b,#64748b)","linear-gradient(135deg,#1d4ed8,#7c3aed)","linear-gradient(135deg,#be185d,#f59e0b)"];
var DEFC=[["A fazer","#8a94a6",0,0],["Em andamento","#2563eb",0,0],["Em revisão","#e0a100",0,0],["Bloqueado","#ef4444",0,1],["Concluído","#16a34a",1,0]];
var D={projetos:[],tarefas:[],custos:[],seq:1};
var tab="geral",pid=null,editP=null,lastCat=null,pend={},addCol=null,fq="",ftag=null,M=null,SH=null,ntc=0;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(n){return "R$ "+Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function dt(s){if(!s)return "-";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function dd(a,b){return Math.round((new Date(a)-new Date(b))/864e5)}
function pj(id){return D.projetos.filter(function(p){return p.id==id})[0]}
function tarefa(id){return D.tarefas.filter(function(t){return t.id==id})[0]}
function colOf(p,id){return p.cols.filter(function(c){return c.id==id})[0]}
function gt(p,id){return p.tags.filter(function(g){return g.id==id})[0]}
function tot(id,tipo){return D.custos.filter(function(c){return c.pid==id&&(!tipo||c.tipo==tipo)}).reduce(function(a,c){return a+c.valor},0)}
function mkCols(){return DEFC.map(function(c){return{id:"c"+(D.seq++),nome:c[0],cor:c[1],done:c[2],block:c[3]}})}
function mkTags(){return [["Urgente",TC[0]],["Qualidade",TC[2]],["Compras",TC[1]],["Melhoria",TC[3]]].map(function(x){return{id:"g"+(D.seq++),nome:x[0],cor:x[1]}})}
function migrate(){
D.projetos.forEach(function(p){if(!p.cols){p.cols=mkCols();p.tags=mkTags();p.bg=p.bg||0}});
D.tarefas.forEach(function(t){var p=pj(t.pid);if(!p)return;
if(!t.col){var c=p.cols.filter(function(c){return c.nome==t.st})[0];t.col=c?c.id:p.cols[0].id;delete t.st}
if(t._tg){t.tags=t._tg.map(function(n){var g=p.tags.filter(function(g){return g.nome==n})[0];return g&&g.id}).filter(Boolean);delete t._tg}
if(t._ck){t.check=t._ck.map(function(x){return{t:x[0],d:x[1]}});delete t._ck}
t.tags=t.tags||[];t.check=t.check||[]});
if(!D.cats)D.cats=CATS.slice()}
function load(){try{var s=localStorage.getItem(KEY);if(s){D=JSON.parse(s)}}catch(e){}
if(!D.projetos.length&&!D.tarefas.length){D.projetos=[{id:1,nome:"Implantação de CRM",status:"Ativo",resp:"Claudio",orc:5000}];D.tarefas=[{id:2,pid:1,nome:"Configurar pipeline",desc:"Deixar o funil de vendas pronto para a equipe.",resp:"Claudio",ini:"2026-10-01",fim:"2026-10-15",st:"Em andamento",_tg:["Urgente"],_ck:[["Criar etapas",1],["Definir regras",0],["Treinar equipe",0]]}];D.custos=[{id:3,pid:1,tipo:"Fixo",cat:"Software",valor:300,data:"2026-10-05",desc:""}];D.seq=4}
migrate()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function go(t){tab=t;render()}
var IC={geral:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',kanban:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>',custos:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.4-.8-1.300-1.200-2.500-1.200-1.500 0-2.500.7-2.500 1.800 0 2.300 5 1.200 5 3.500 0 1.100-1 1.800-2.500 1.800-1.200 0-2.100-.4-2.500-1.200M12 6.500v11"/>',resumo:'<path d="M5 20V10M12 20V4M19 20v-7"/>'};
function render(){
if(!pj(pid))pid=D.projetos.length?D.projetos[0].id:null;
var T=[["geral","Projetos"],["kanban","Kanban"],["custos","Custos"],["resumo","Resumo"]];
$("nav").innerHTML=T.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><svg viewBox="0 0 24 24">'+IC[t[0]]+'</svg>'+t[1]+'</button>'}).join("");
$("v").innerHTML=tab=="geral"?vGeral():tab=="kanban"?vKanban():tab=="resumo"?vResumo():vCustos();
window.scrollTo(0,0)}
function popts(sel){return D.projetos.map(function(p){return '<option value="'+p.id+'"'+(p.id==sel?" selected":"")+'>'+esc(p.nome)+'</option>'}).join("")}
function pickP(){return '<select class="ps" onchange="pid=+this.value;render()">'+popts(pid)+'</select>'}
function isDone(t,p){var c=colOf(p,t.col);return !!(c&&c.done)}
/* ---------- PROJETOS ---------- */
function vGeral(){
var e=editP?pj(editP):null;e=e||{};
var ab=D.tarefas.filter(function(t){var p=pj(t.pid);return p&&!isDone(t,p)}).length,ct=D.custos.reduce(function(a,c){return a+c.valor},0);
var r=D.projetos.map(function(p){var L=D.tarefas.filter(function(t){return t.pid==p.id}),c=L.filter(function(t){return isDone(t,p)}).length;
return '<tr><td>'+esc(p.nome)+'</td><td><span class="tag">'+p.status+'</span></td><td>'+esc(p.resp)+'</td><td>'+c+'/'+L.length+'</td><td>'+money(tot(p.id))+(p.orc?' de '+money(p.orc):'')+'</td><td><button class="btn s" onclick="pid='+p.id+';go(\'kanban\')">Abrir</button> <button class="btn s" onclick="edP('+p.id+')">Editar</button> <button class="btn s" onclick="delP('+p.id+')">Excluir</button></td></tr>'}).join("");
return '<div class="cover"><div class="hd"><div class="logo">📋</div><div><h1>Meu Gestor Simples</h1><p>Projetos, tarefas e custos em um só lugar</p></div></div><div class="cs"><div><b>'+D.projetos.length+'</b>Projetos</div><div><b>'+ab+'</b>Tarefas abertas</div><div><b>'+money(ct)+'</b>Custo total</div></div></div>'+
'<div class="card"><h3>Seus projetos</h3><div class="sc"><table><tr><th>Projeto</th><th>Status</th><th>Responsável</th><th>Tarefas</th><th>Custo</th><th></th></tr>'+(r||'<tr><td colspan="6" class="mut">Nenhum projeto ainda.</td></tr>')+'</table></div></div>'+
'<div class="card"><h3>'+(e.id?'Editar projeto':'Novo projeto')+'</h3><label>Nome</label><input id="pn" value="'+esc(e.nome)+'"><div class="row"><div><label>Responsável</label><input id="pr" value="'+esc(e.resp)+'"></div><div><label>Status</label><select id="ps">'+PST.map(function(s){return '<option'+(s==e.status?' selected':'')+'>'+s+'</option>'}).join("")+'</select></div></div><label>Orçamento (R$, opcional)</label><input id="po" type="number" step="0.01" inputmode="decimal" value="'+(e.orc||"")+'"><button class="btn" onclick="addP()">Salvar projeto</button>'+(e.id?' <button class="btn s" style="margin-top:10px" onclick="editP=null;render()">Cancelar</button>':'')+'</div>'+
'<div class="card"><h3>💾 Backup</h3><p class="mut">Baixe um arquivo com todos os seus dados para guardar ou levar para outro aparelho.</p><button class="btn" onclick="expB()">Exportar backup</button> <label class="btn" style="display:inline-block;font-size:15px;color:#fff">Importar backup<input type="file" accept=".json,application/json" style="display:none" onchange="impB(this)"></label></div>'+
'<div class="card"><h3>🧪 Exemplos</h3><p class="mut">Carrega 2 projetos de exemplo com tags e checklists. Não apaga o que você já cadastrou.</p><button class="btn" onclick="loadEx()">Carregar exemplos</button></div>'}
function edP(id){editP=id;render();window.scrollTo(0,document.body.scrollHeight)}
function addP(){var n=$("pn").value.trim();if(!n){alert("Informe o nome do projeto.");return}
var o={nome:n,resp:$("pr").value.trim(),status:$("ps").value,orc:parseFloat($("po").value)||0};
if(editP){var p=pj(editP);for(var k in o)p[k]=o[k];editP=null}else{o.id=D.seq++;D.projetos.push(o);pid=o.id;migrate()}
save();render()}
function delP(id){if(!confirm("Excluir o projeto, suas tarefas e custos?"))return;D.projetos=D.projetos.filter(function(p){return p.id!=id});D.tarefas=D.tarefas.filter(function(t){return t.pid!=id});D.custos=D.custos.filter(function(c){return c.pid!=id});pid=null;save();render()}
function expB(){var b=new Blob([JSON.stringify(D)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="gestor-backup-"+today()+".json";a.click()}
function impB(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.projetos||!o.tarefas||!o.custos)throw 0;if(!confirm("Isso substitui os dados atuais pelos do backup. Continuar?"))return;D=o;pid=null;migrate();save();render()}catch(e){alert("Arquivo de backup inválido.")}};r.readAsText(f)}

D.projetos.push({id:a,nome:"Exemplo: App NIKEN Qualidade",status:"Ativo",resp:"Claudio",orc:2000},{id:b,nome:"Exemplo: Quadro de Operadores",status:"Ativo",resp:"Claudio",orc:800});
function T(p,n,d,s,i,f,tg,ck){D.tarefas.push({id:D.seq++,pid:p,nome:n,desc:d,resp:"Claudio",ini:i,fim:f,st:s,_tg:tg,_ck:ck})}
function C(p,t,c,v,dd2,ds){D.custos.push({id:D.seq++,pid:p,tipo:t,cat:c,valor:v,data:dd2,desc:ds})}
T(a,"Cadastrar Plano de Controle","Telas do RIP, ITP e Plano de Controle","Concluído","2026-10-01","2026-10-10",["Qualidade"],[["Tela do RIP",1],["Tela do ITP",1],["Plano de Controle",1]]);
T(a,"Testar no coletor","Validar com operadores no chão de fábrica","Em andamento","2026-10-20","2026-10-30",["Urgente","Qualidade"],[["Testar login",1],["Testar sem internet",0],["Coletar feedback",0]]);

T(a,"Liberar internet no coletor","Depende da TI","Bloqueado","2026-10-15","2026-10-20",["Urgente"],[]);
T(a,"Treinar operadores","Mostrar como usar o app","A fazer","2026-11-03","2026-11-10",["Melhoria"],[["Montar roteiro",0],["Agendar turma",0]]);
T(b,"Listar as 18 máquinas","Cadastro das máquinas do 1º turno","Concluído","2026-09-25","2026-09-28",[],[]);
T(b,"Alocar operadores","Ver quem fica sem máquina","Em andamento","2026-10-01","2026-10-31",["Urgente"],[["Turno 1",1],["Turno 2",0]]);
T(b,"Apresentar ao diretor","Mostrar o quadro pronto","A fazer","2026-11-05","2026-11-06",["Melhoria"],[]);
C(a,"Fixo","Software",100,"2026-10-05","Assinatura de ferramentas");C(a,"Variável","Mão de obra",600,"2026-10-12","Horas de desenvolvimento");C(a,"Variável","Equipamento",250,"2026-10-18","Suporte para coletor");
C(b,"Fixo","Software",50,"2026-09-30","Hospedagem");C(b,"Variável","Mão de obra",300,"2026-10-08","Horas de desenvolvimento");
migrate();pid=a;save();render()}

if(ftag&&t.tags.indexOf(ftag)<0)return false;return true}

var p=pj(pid);
var fl=p.tags.map(function(g){return '<span class="tg sel'+(ftag==g.id?" on":"")+'" style="background:'+g.cor+'" onclick="ftag=ftag==\''+g.id+'\'?null:\''+g.id+'\';render()">'+esc(g.nome)+'</span>'}).join("");

function rb(){$("board").innerHTML=vBoard()}
function vBoard(){var p=pj(pid),hoje=today();
return p.cols.map(function(c){
var L=D.tarefas.filter(function(t){return t.pid==pid&&t.col==c.id&&match(t)});
var add=addCol==c.id?'<div class="addbox"><textarea id="nc" rows="2" placeholder="Título do cartão"></textarea><div class="mv"><button class="btn" onclick="addCard(\''+c.id+'\')">Adicionar</button><button class="btn s" onclick="addCol=null;rb()">✕</button></div></div>':'<button class="addb" onclick="addCol=\''+c.id+'\';rb();setTimeout(function(){var e=$(\'nc\');if(e)e.focus()},50)">+ Adicionar cartão</button>';
return '<div class="kc" data-col="'+c.id+'"><div class="kh"><span><i class="dot" style="background:'+c.cor+'"></i>'+esc(c.nome)+'<em>'+L.length+'</em></span><button class="ic" onclick="sheet(\'col\',\''+c.id+'\')">⋯</button></div><div class="cl">'+L.map(function(t){return card(t,p,c,hoje)}).join("")+'</div>'+add+'</div>'}).join("")+'<div class="kc nc"><button class="addb" style="color:#fff" onclick="addColumn()">+ Adicionar coluna</button></div>'}
function card(t,p,c,hoje){
var tg=t.tags.map(function(id){var g=gt(p,id);return g?'<span class="tg" style="background:'+g.cor+'">'+esc(g.nome)+'</span>':''}).join("");
var m="";
if(t.fim){var cls=c.done?"ok":t.fim<hoje?"late":dd(t.fim,hoje)<=2?"soon":"";m+='<span class="chip '+cls+'">📅 '+dt(t.fim).slice(0,5)+'</span>'}
if(t.check.length){var d=t.check.filter(function(x){return x.d}).length;m+='<span class="chip'+(d==t.check.length?" ok":"")+'">☑ '+d+'/'+t.check.length+'</span>'}
if(t.desc)m+='<span class="chip">≡</span>';

return '<div class="t" data-id="'+t.id+'">'+(tg?'<div class="tgs">'+tg+'</div>':'')+'<div class="tt">'+esc(t.nome)+'</div><div class="tm">'+m+av+'</div></div>'}
function addCard(cid){var e=$("nc"),n=e.value.trim();if(!n)return;D.tarefas.push({id:D.seq++,pid:pid,nome:n,desc:"",resp:"",ini:"",fim:"",col:cid,tags:[],check:[]});save();rb();var x=$("nc");if(x)x.focus()}
function addColumn(){var n=(prompt("Nome da nova coluna:")||"").trim();if(!n)return;pj(pid).cols.push({id:"c"+(D.seq++),nome:n,cor:"#8a94a6",done:0,block:0});save();render()}
/* ---------- MODAL / SHEET ---------- */
function openT(id){M=JSON.parse(JSON.stringify(tarefa(id)));rOv()}
function closeM(){M=null;rOv()}
function closeS(){SH=null;rOv()}
function sheet(t,id){SH={t:t,id:id};rOv()}
function rOv(){var a=$("ci")?$("ci").value:"",b=$("nt")?$("nt").value:"";
$("ov").innerHTML=M?mHTML():SH?shHTML():"";
if($("ci"))$("ci").value=a;if($("nt"))$("nt").value=b;
document.body.style.overflow=(M||SH)?"hidden":""}
function mHTML(){var p=pj(M.pid);
var tags=p.tags.map(function(g){var on=M.tags.indexOf(g.id)>=0;return '<span class="tg sel'+(on?" on":"")+'" style="background:'+g.cor+'" onclick="togTag(\''+g.id+'\')">'+(on?"✓ ":"")+esc(g.nome)+'</span>'}).join("")||'<span class="mut">Sem tags. Crie abaixo.</span>';
var ck=M.check.map(function(x,i){return '<div class="ck"><input type="checkbox" '+(x.d?"checked":"")+' onchange="M.check['+i+'].d=this.checked;rOv()"><span class="'+(x.d?"dn":"")+'">'+esc(x.t)+'</span><button class="ic" onclick="M.check.splice('+i+',1);rOv()">✕</button></div>'}).join("");
var n=M.check.length,d=M.check.filter(function(x){return x.d}).length,pr=n?Math.round(d/n*100):0;
return '<div class="mo" onclick="if(event.target==this)closeM()"><div class="md"><div class="mh"><b>Cartão</b><button class="ic" onclick="closeM()">✕</button></div>'+
'<label>Título</label><input value="'+esc(M.nome)+'" oninput="M.nome=this.value">'+
'<label>Descrição</label><textarea rows="3" oninput="M.desc=this.value">'+esc(M.desc)+'</textarea>'+
'<label>Tags</label><div class="tgs">'+tags+'</div><div class="nt"><input id="nt" placeholder="Nova tag"><span>'+TC.map(function(c,i){return '<i class="sw'+(i==ntc?" on":"")+'" style="background:'+c+'" onclick="pickSw(this,'+i+')"></i>'}).join("")+'</span><button class="btn s" onclick="mkTag()">Criar</button></div>'+
'<div class="row"><div><label>Coluna</label><select onchange="M.col=this.value">'+p.cols.map(function(c){return '<option value="'+c.id+'"'+(c.id==M.col?" selected":"")+'>'+esc(c.nome)+'</option>'}).join("")+'</select></div><div><label>Responsável</label><input value="'+esc(M.resp)+'" oninput="M.resp=this.value"></div><div><label>Início</label><input type="date" value="'+(M.ini||"")+'" oninput="M.ini=this.value"></div><div><label>Fim</label><input type="date" value="'+(M.fim||"")+'" oninput="M.fim=this.value"></div></div>'+
'<label>Checklist'+(n?' · '+d+'/'+n:'')+'</label>'+(n?'<div class="pb"><i style="width:'+pr+'%"></i></div>':'')+ck+
'<div class="nt"><input id="ci" placeholder="Novo item" onkeydown="if(event.key==\'Enter\')addCk()"><button class="btn s" onclick="addCk()">Adicionar</button></div>'+
'<div class="mv" style="margin-top:16px"><button class="btn" onclick="saveM()">Salvar</button><button class="btn d" onclick="delT()">Excluir</button></div></div></div>'}
function pickSw(el,i){ntc=i;var s=el.parentNode.children;for(var k=0;k<s.length;k++)s[k].classList.remove("on");el.classList.add("on")}
function togTag(id){var i=M.tags.indexOf(id);if(i<0)M.tags.push(id);else M.tags.splice(i,1);rOv()}
function mkTag(){var n=$("nt").value.trim();if(!n)return;var p=pj(M.pid),g={id:"g"+(D.seq++),nome:n,cor:TC[ntc]};p.tags.push(g);M.tags.push(g.id);$("nt").value="";save();rOv()}
function addCk(){var n=$("ci").value.trim();if(!n)return;M.check.push({t:n,d:false});$("ci").value="";rOv();$("ci").focus()}
function saveM(){if(!M.nome.trim()){alert("Informe o título.");return}var i=D.tarefas.map(function(t){return t.id}).indexOf(M.id);D.tarefas[i]=M;M=null;save();rOv();render_keep()}
function delT(){if(!confirm("Excluir este cartão?"))return;D.tarefas=D.tarefas.filter(function(t){return t.id!=M.id});M=null;save();rOv();render_keep()}
function render_keep(){var b=$("board"),x=b?b.scrollLeft:0,y=window.scrollY;render();var b2=$("board");if(b2)b2.scrollLeft=x;window.scrollTo(0,y)}
function shHTML(){var p=pj(pid),h="";
if(SH.t=="col"){var c=colOf(p,SH.id);h='<h3>'+esc(c.nome)+'</h3><button class="btn s wide" onclick="renCol()">✎ Renomear</button><button class="btn s wide" onclick="moveCol(-1)">◀ Mover para a esquerda</button><button class="btn s wide" onclick="moveCol(1)">▶ Mover para a direita</button><button class="btn s wide" onclick="togDone()">'+(c.done?'☑ Coluna de concluídos':'☐ Marcar como coluna de concluídos')+'</button><button class="btn d wide" onclick="delCol()">🗑 Excluir coluna</button>'}
else if(SH.t=="bg"){h='<h3>Fundo do quadro</h3><div class="bgs">'+BG.map(function(b,i){return '<i class="'+(i==(p.bg||0)?"on":"")+'" style="background:'+b+'" onclick="setBg('+i+')"></i>'}).join("")+'</div>'}
else{h='<h3>Tags do projeto</h3>'+(p.tags.map(function(g){return '<div class="mrow"><span class="tg" style="background:'+g.cor+'">'+esc(g.nome)+'</span><span><button class="btn s" onclick="renTag(\''+g.id+'\')">Renomear</button> <button class="btn s" onclick="delTag(\''+g.id+'\')">✕</button></span></div>'}).join("")||'<p class="mut">Nenhuma tag. Crie dentro de um cartão.</p>')}
return '<div class="mo" onclick="if(event.target==this)closeS()"><div class="md">'+h+'<button class="btn s wide" style="text-align:center;margin-top:14px" onclick="closeS()">Fechar</button></div></div>'}
function done(){SH=null;save();rOv();render_keep()}
function renCol(){var c=colOf(pj(pid),SH.id),n=(prompt("Novo nome da coluna:",c.nome)||"").trim();if(n){c.nome=n;done()}}
function moveCol(d){var a=pj(pid).cols,i=a.map(function(c){return c.id}).indexOf(SH.id),j=i+d;if(j<0||j>=a.length)return;var x=a[i];a[i]=a[j];a[j]=x;done()}

function delCol(){var p=pj(pid);if(p.cols.length<2){alert("O quadro precisa ter ao menos uma coluna.");return}if(!confirm("Excluir a coluna? Os cartões dela vão para a coluna vizinha."))return;var i=p.cols.map(function(c){return c.id}).indexOf(SH.id),dest=p.cols[i>0?i-1:1].id;D.tarefas.forEach(function(t){if(t.pid==pid&&t.col==SH.id)t.col=dest});p.cols.splice(i,1);done()}
function setBg(i){pj(pid).bg=i;done()}
function renTag(id){var g=gt(pj(pid),id),n=(prompt("Novo nome da tag:",g.nome)||"").trim();if(n){g.nome=n;save();rOv();render_keep()}}
function delTag(id){if(!confirm("Excluir a tag? Ela sai de todos os cartões."))return;var p=pj(pid);p.tags=p.tags.filter(function(g){return g.id!=id});D.tarefas.forEach(function(t){t.tags=t.tags.filter(function(x){return x!=id})});if(ftag==id)ftag=null;save();rOv();render_keep()}
/* ---------- ARRASTAR E SOLTAR ---------- */
var dg=null,dtimer=null,justDragged=false,sx=0,sy=0;
function dStart(x,y,el){sx=x;sy=y;clearTimeout(dtimer);dtimer=setTimeout(function(){begin(el,x,y)},380)}
function begin(el,x,y){var r=el.getBoundingClientRect(),g=el.cloneNode(true);g.className+=" ghost";g.style.width=r.width+"px";g.style.left=r.left+"px";g.style.top=r.top+"px";document.body.appendChild(g);el.classList.add("lift");dg={el:el,g:g,ox:x-r.left,oy:y-r.top,id:+el.dataset.id};if(navigator.vibrate)navigator.vibrate(15)}
function under(x,y){dg.g.style.display="none";var e=document.elementFromPoint(x,y);dg.g.style.display="";return e}
function dMove(x,y,ev){if(!dg){if(Math.abs(x-sx)>8||Math.abs(y-sy)>8)clearTimeout(dtimer);return}
if(ev.cancelable)ev.preventDefault();
dg.g.style.left=(x-dg.ox)+"px";dg.g.style.top=(y-dg.oy)+"px";
var b=$("board");if(b){if(x<50)b.scrollLeft-=14;else if(x>innerWidth-50)b.scrollLeft+=14}
[].forEach.call(document.querySelectorAll(".kc.over"),function(e){e.classList.remove("over")});
var e=under(x,y),c=e&&e.closest?e.closest(".kc[data-col]"):null;if(c)c.classList.add("over")}
function dEnd(x,y){clearTimeout(dtimer);if(!dg)return;
var e=under(x,y),c=e&&e.closest?e.closest(".kc[data-col]"):null,tc=e&&e.closest?e.closest(".t"):null,tk=tarefa(dg.id);
if(c&&tk){tk.col=c.dataset.col;D.tarefas=D.tarefas.filter(function(t){return t.id!=tk.id});var ti=tc?D.tarefas.map(function(t){return t.id}).indexOf(+tc.dataset.id):-1;if(ti>=0)D.tarefas.splice(ti,0,tk);else D.tarefas.push(tk);save()}
dg.g.remove();dg=null;justDragged=true;setTimeout(function(){justDragged=false},350);render_keep()}
var V=$("v");
V.addEventListener("touchstart",function(e){var c=e.target.closest&&e.target.closest(".t");if(!c)return;var q=e.touches[0];dStart(q.clientX,q.clientY,c)},{passive:true});
document.addEventListener("touchmove",function(e){var q=e.touches[0];dMove(q.clientX,q.clientY,e)},{passive:false});
document.addEventListener("touchend",function(e){var q=e.changedTouches[0];dEnd(q.clientX,q.clientY)});
V.addEventListener("mousedown",function(e){var c=e.target.closest&&e.target.closest(".t");if(!c)return;dStart(e.clientX,e.clientY,c)});
document.addEventListener("mousemove",function(e){dMove(e.clientX,e.clientY,e)});
document.addEventListener("mouseup",function(e){dEnd(e.clientX,e.clientY)});
V.addEventListener("click",function(e){var c=e.target.closest&&e.target.closest(".t");if(c&&!justDragged&&!dg)openT(+c.dataset.id)});
/* ---------- CUSTOS ---------- */
function vCustos(){
if(!D.projetos.length)return '<div class="card mut">Cadastre um projeto primeiro.</div>';
var p=pj(pid),L=D.custos.filter(function(c){return c.pid==pid}).sort(function(a,b){return a.data<b.data?1:-1});
var tt=tot(pid),sobra=p.orc?p.orc-tt:null;
return '<div class="tb">'+pickP()+'</div><div class="card"><h3>💰 Controle de custo</h3><div class="tot"><div><span class="mut">Fixo</span><b>'+money(tot(pid,"Fixo"))+'</b></div><div><span class="mut">Variável</span><b>'+money(tot(pid,"Variável"))+'</b></div><div><span class="mut">Total</span><b>'+money(tt)+'</b></div>'+(sobra!==null?'<div><span class="mut">Saldo</span><b style="color:'+(sobra<0?'var(--bad)':'#16a34a')+'">'+money(sobra)+'</b></div>':'')+'</div></div>'+
'<div class="card"><div class="sc"><table><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th></th></tr>'+(L.map(function(c){return '<tr><td>'+dt(c.data)+'</td><td>'+c.tipo+'</td><td>'+esc(c.cat)+'</td><td>'+esc(c.desc)+'</td><td><b>'+money(c.valor)+'</b></td><td><button class="btn s" onclick="delC('+c.id+')">✕</button></td></tr>'}).join("")||'<tr><td colspan="6" class="mut">Sem custos.</td></tr>')+'</table></div></div>'+
'<div class="card"><h3>➕ Novo custo</h3><div class="row"><div><label>Tipo</label><select id="ct"><option>Fixo</option><option'+(pend.ct=="Variável"?" selected":"")+'>Variável</option></select></div><div><label>Categoria</label><select id="cc" onchange="newCat(this)">'+D.cats.map(function(c){return '<option'+(c==lastCat?" selected":"")+'>'+esc(c)+'</option>'}).join("")+'<option value="__new">➕ Nova categoria…</option></select></div><div><label>Valor (R$)</label><input id="cv" type="number" step="0.01" inputmode="decimal" value="'+(pend.cv||"")+'"></div><div><label>Data</label><input id="cd" type="date" value="'+today()+'"></div></div><label>Descrição (opcional)</label><input id="cx" value="'+esc(pend.cx)+'"><button class="btn" onclick="addC()">Salvar custo</button></div>'+
'<div class="card"><h3>🏷️ Categorias de custo</h3>'+D.cats.map(function(c,i){return '<div class="mrow"><span>'+esc(c)+'</span><span><button class="btn s" onclick="renCat('+i+')">Renomear</button> <button class="btn s" onclick="delCat('+i+')">✕</button></span></div>'}).join("")+'</div>'}
function newCat(s){if(s.value!="__new")return;pend={ct:$("ct").value,cv:$("cv").value,cx:$("cx").value};var n=(prompt("Nome da nova categoria:")||"").trim();if(n&&D.cats.indexOf(n)<0){D.cats.push(n);save()}lastCat=n||D.cats[0];render()}
function renCat(i){var o=D.cats[i],n=(prompt("Novo nome para a categoria:",o)||"").trim();if(!n||n==o)return;D.cats[i]=n;D.custos.forEach(function(c){if(c.cat==o)c.cat=n});save();render()}
function delCat(i){if(!confirm("Excluir a categoria? Os custos já lançados mantêm o nome dela."))return;D.cats.splice(i,1);save();render()}
function addC(){var v=parseFloat($("cv").value);if(!(v>0)){alert("Informe um valor.");return}
D.custos.push({id:D.seq++,pid:pid,tipo:$("ct").value,cat:$("cc").value,valor:v,data:$("cd").value,desc:$("cx").value.trim()});pend={};lastCat=null;save();render()}
function delC(id){if(!confirm("Excluir custo?"))return;D.custos=D.custos.filter(function(c){return c.id!=id});save();render()}
/* ---------- RESUMO ---------- */
function bar(p,c){return '<div class="bk"><i style="width:'+Math.min(Math.max(p,0),100)+'%;background:'+c+'"></i></div>'}
function vResumo(){
if(!D.projetos.length)return '<div class="card mut">Cadastre um projeto primeiro.</div>';
var p=pj(pid),tt=tot(pid),orc=p.orc||0,pc=orc?Math.round(tt/orc*100):0,hoje=today();
var TL=D.tarefas.filter(function(t){return t.pid==pid}),n=TL.length,dn=TL.filter(function(t){return isDone(t,p)}).length,pg=n?Math.round(dn/n*100):0;
var bc=pc>=100?"#d64545":pc>=80?"#e0a100":"#2563eb";
var st=p.cols.map(function(c){var q=TL.filter(function(t){return t.col==c.id}).length;return '<div class="rl"><span>'+esc(c.nome)+'</span><b>'+q+'</b></div>'+bar(n?q/n*100:0,c.cor)}).join("");
var cs={};D.custos.filter(function(c){return c.pid==pid}).forEach(function(c){cs[c.cat]=(cs[c.cat]||0)+c.valor});
var ck=Object.keys(cs).sort(function(a,b){return cs[b]-cs[a]});
var cb=ck.map(function(k){return '<div class="rl"><span>'+esc(k)+'</span><b>'+money(cs[k])+'</b></div>'+bar(tt?cs[k]/tt*100:0,"#2563eb")}).join("")||'<div class="rl">Sem custos lançados</div>';
var al=TL.filter(function(t){var c=colOf(p,t.col);return !isDone(t,p)&&((t.fim&&t.fim<hoje)||(c&&c.block))}).map(function(t){var c=colOf(p,t.col);return '<div class="rl"><span>'+(c&&c.block?"🚫":"⏰")+' '+esc(t.nome)+'</span><span>'+(c&&c.block?"Bloqueada":"Atrasada")+' · '+dt(t.fim)+'</span></div>'}).join("")||'<div class="rl">✅ Nenhum ponto de atenção</div>';
var orcH=orc?'<div class="rl"><span>Gasto '+money(tt)+' de '+money(orc)+'</span><b style="color:'+bc+'">'+pc+'%</b></div>'+bar(pc,bc)+'<div class="rm">Saldo: '+money(orc-tt)+(pc>=100?' ⚠️ orçamento estourado':pc>=80?' ⚠️ próximo do limite':'')+'</div>':'<div class="rl"><span>Total gasto</span><b>'+money(tt)+'</b></div><div class="rm">Sem orçamento definido</div>';
return '<div class="tb">'+pickP()+'</div><div class="card"><button class="btn" style="margin:0;width:100%" onclick="shareR()">📤 Compartilhar imagem</button></div>'+
'<div class="rs" id="rs"><div class="rt">'+esc(p.nome)+'</div><div class="rm">Responsável: '+esc(p.resp||"-")+' · '+p.status+' · Gerado em '+dt(hoje)+'</div>'+
'<div class="rh">Progresso das tarefas</div><div class="rl"><span>'+dn+' de '+n+' concluídas</span><b>'+pg+'%</b></div>'+bar(pg,"#16a34a")+
'<div class="rh">Orçamento</div>'+orcH+'<div class="rm">Fixo: '+money(tot(pid,"Fixo"))+' · Variável: '+money(tot(pid,"Variável"))+'</div>'+
'<div class="rh">Tarefas por status</div>'+st+'<div class="rh">Custos por categoria</div>'+cb+'<div class="rh">Pontos de atenção</div>'+al+'</div>'}
function shareR(){var el=$("rs");if(typeof html2canvas=="undefined"){alert("Não foi possível gerar a imagem agora. Tire um print da tela.");return}
html2canvas(el,{scale:2,backgroundColor:"#ffffff"}).then(function(c){c.toBlob(function(b){var f=new File([b],"resumo-projeto.png",{type:"image/png"});
if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Resumo do projeto"}).catch(function(){})}else{var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="resumo-projeto.png";a.click()}})})}
load();render();
try{if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script>
